<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการแก้ไข · ระบบลงเวลาและการลา</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="audit" class="app-loading">
    <header id="app-header"></header>

    <main class="container">
        <div class="page-head">
            <div>
                <h1>ประวัติการแก้ไข</h1>
                <div class="subtitle">ใครเพิ่ม แก้ไข ลบ หรือเข้าสู่ระบบ เมื่อไหร่ (เฉพาะผู้ดูแลระบบ)</div>
            </div>
        </div>

        <div id="page-message" class="message" role="status"></div>

        <section class="card">
            <form id="filters" class="filters">
                <div class="field">
                    <label for="entity">ข้อมูล</label>
                    <select id="entity" name="entity"></select>
                </div>
                <div class="field">
                    <label for="action">การกระทำ</label>
                    <select id="action" name="action"></select>
                </div>
                <div class="field">
                    <label for="user_id">ผู้ใช้</label>
                    <select id="user_id" name="user_id"></select>
                </div>
                <div class="field">
                    <label for="from">ตั้งแต่วันที่</label>
                    <input id="from" name="from" type="date">
                </div>
                <div class="field">
                    <label for="to">ถึงวันที่</label>
                    <input id="to" name="to" type="date">
                </div>
            </form>
            <div id="table"><p class="table-message">กำลังโหลด...</p></div>
            <div class="table-foot" id="pagination"></div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/audit.js"></script>
</body>
</html>
