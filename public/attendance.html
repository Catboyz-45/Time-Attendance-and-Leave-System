<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลา</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">หน้าหลัก</a></li>
                <li><a href="attendance.html">ลงเวลางาน</a></li>
                <li><a href="leave.html">คำร้องขอลางาน</a></li>
                <li><a href="history.html">ประวัติการทำงานและการลา</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <div class="header-form">
                <h1 id="page-title">ระบบลงเวลาทำงาน</h1>
                <div class="form-input">
                    <label for="employee_id">รหัสพนักงาน:</label>
                    <input id="employee_id" name="employee_id" type="text" inputmode="numeric" placeholder="กรอกรหัสพนักงาน (ตัวเลข)">
                </div>
                <div class="form-input">
                    <label for="date">วันที่:</label>
                    <input id="date" name="date" type="date">
                </div>
                <div class="form-input">
                    <label for="time_in">เวลาเข้างาน:</label>
                    <input id="time_in" name="time_in" type="time">
                </div>
                <div class="form-input">
                    <label for="time_out">เวลาออกงาน: <span class="optional">(ไม่บังคับ เพิ่มทีหลังได้จากหน้าประวัติ)</span></label>
                    <input id="time_out" name="time_out" type="time">
                </div>

                <div id="message" class="message" role="status"></div>

                <div class="center">
                    <button type="button" id="submitBtn">ส่งข้อมูล</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>ระบบการจัดการลงเวลาและการลา</p>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
