<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลา · ระบบลงเวลาและการลา</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="attendance" class="app-loading">
    <header id="app-header"></header>

    <main class="container narrow">
        <div class="page-head">
            <div>
                <h1 id="page-title">ลงเวลาทำงาน</h1>
                <div class="subtitle">บันทึกเวลาเข้า-ออกงานแทนพนักงาน</div>
            </div>
            <div class="actions">
                <a class="btn secondary" href="history.html?tab=attendance">กลับไปหน้ารายการ</a>
            </div>
        </div>

        <div id="page-message" class="message" role="status"></div>

        <form id="attendance-form" class="card" novalidate>
            <div class="form-grid">
                <div class="field full">
                    <label for="employee_id">พนักงาน</label>
                    <select id="employee_id" name="employee_id" required></select>
                </div>
                <div class="field">
                    <label for="date">วันที่</label>
                    <input id="date" name="date" type="date" required>
                </div>
                <div class="field"></div>
                <div class="field">
                    <label for="time_in">เวลาเข้างาน</label>
                    <input id="time_in" name="time_in" type="time" required>
                </div>
                <div class="field">
                    <label for="time_out">เวลาออกงาน</label>
                    <input id="time_out" name="time_out" type="time">
                    <span class="hint">ไม่บังคับ เพิ่มทีหลังได้</span>
                </div>
                <div class="field full">
                    <label for="note">หมายเหตุ</label>
                    <input id="note" name="note" type="text" maxlength="255" placeholder="เช่น ลืมสแกนนิ้ว, ไปพบลูกค้า">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn danger hidden" id="delete-btn">ลบรายการนี้</button>
                <button type="submit" class="btn" id="submit-btn">บันทึก</button>
            </div>
        </form>
    </main>

    <script src="js/common.js"></script>
    <script src="js/pickers.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
